; ПИД-регулятор для плавки парафина — PlatformIO
;
; Сборка:    pio run -e esp32s3-oled
; Прошивка:  pio run -e esp32s3-oled -t upload
; Монитор:   pio device monitor
; Тесты ПК:  pio test -e native
;
; Имена окружений: <плата>-<дисплей>
;   платы:   esp32s3, pico2 (без Wi-Fi), pico2w
;   дисплеи: oled    — SSD1306 0.96" 128x64 I2C
;            sh1106  — SH1106 1.3" 128x64 I2C
;            tft096  — ST7735 0.96" 80x160 SPI
;            tft     — ST7789 2.0"/2.4" 240x320 SPI (другие размеры — см. include/display_config.h)
;            ili9341 — ILI9341 2.4"/2.8" 240x320 SPI
;
; Платформа ESP32-S3 — официальная platformio/espressif32 (Arduino core 2.x).

[platformio]
default_envs = esp32s3-oled

; ------------------------------------------------------------ общее
[common]
; OneWire 2.3.8 из реестра не собирается на IDF 5.x — берём коммит из git с исправлением
build_flags =
    -Iinclude
    -Wall
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit BusIO@^1.17.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit SH110X@^2.1.13
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit ILI9341@^1.6.1
    https://github.com/PaulStoffregen/OneWire.git#800f26f3ee6eb446a72e013785cac3700e54cc13
    milesburton/DallasTemperature@^4.0.4
    bblanchon/ArduinoJson@^7.4.1
    knolleary/PubSubClient@^2.8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ------------------------------------------------------------ платы
; Общие настройки ESP32 (без platform — его задаёт конкретный MCU)
[esp32_common]
framework = arduino
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
; приложение с Wi-Fi + веб ≈ 1.1–1.2 МБ: без OTA берём раздел побольше
board_build.partitions = huge_app.csv

; ESP32-S3 — официальная платформа PlatformIO (Arduino core 2.0.17, ESP-IDF 4.4).
; Версию фиксируем: без неё подхватится старшая установленная espressif32
; (например pioarduino 55.x), и сборка «молча» уедет на другое ядро.
[esp32_platformio]
extends = esp32_common
platform = platformio/espressif32 @ 7.1.3

[mcu_esp32s3]
extends = esp32_platformio
board = esp32-s3-devkitc-1
build_flags = ${esp32_common.build_flags}

; RP2350 — ядро arduino-pico (Earle Philhower)
; Коммит фиксируем: HEAD форка меняется вместе с версией arduino-pico.
[rp2350_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
; LDF ошибочно подтягивает библиотеки iLabs (для плат с сопроцессором ESP32-C6, у нас такой нет) — не нужны
lib_ignore =
    iLabs Hearth
    iLabs ESP-NOW
monitor_speed = ${common.monitor_speed}

[mcu_pico2]
extends = rp2350_base
board = rpipico2
build_flags = ${rp2350_base.build_flags} -DHAS_WIFI=0

[mcu_pico2w]
extends = rp2350_base
board = rpipico2w
build_flags = ${rp2350_base.build_flags} -DHAS_WIFI=1

; ------------------------------------------------------------ дисплеи
[disp_oled]
build_flags = -DDISPLAY_SSD1306
[disp_sh1106]
build_flags = -DDISPLAY_SH1106
[disp_sh1106_spi]
build_flags = -DDISPLAY_SH1106 -DOLED_SPI
[disp_tft096]
build_flags = -DDISPLAY_ST7735 -DDISP_W=160 -DDISP_H=80
[disp_tft]
build_flags = -DDISPLAY_ST7789 -DDISP_W=320 -DDISP_H=240
[disp_ili9341]
build_flags = -DDISPLAY_ILI9341 -DDISP_SPI_HZ=27000000

; ------------------------------------------------------------ окружения
[env:esp32s3-oled]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_oled.build_flags}
[env:esp32s3-sh1106]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_sh1106.build_flags}
[env:esp32s3-sh1106-spi]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_sh1106_spi.build_flags}
[env:esp32s3-tft096]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_tft096.build_flags}
[env:esp32s3-tft]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_tft.build_flags}
[env:esp32s3-ili9341]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_ili9341.build_flags}


; Отладка без датчиков: модель ванны вместо DS18B20 (см. src/sim_sensors.h, CLI: sim)
[env:esp32s3-sh1106-sim]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_sh1106.build_flags} -DSIM_SENSORS=1

[env:pico2-oled]
extends = mcu_pico2
build_flags = ${mcu_pico2.build_flags} ${disp_oled.build_flags}
[env:pico2-tft096]
extends = mcu_pico2
build_flags = ${mcu_pico2.build_flags} ${disp_tft096.build_flags}
[env:pico2-tft]
extends = mcu_pico2
build_flags = ${mcu_pico2.build_flags} ${disp_tft.build_flags}

[env:pico2w-oled]
extends = mcu_pico2w
build_flags = ${mcu_pico2w.build_flags} ${disp_oled.build_flags}
[env:pico2w-tft096]
extends = mcu_pico2w
build_flags = ${mcu_pico2w.build_flags} ${disp_tft096.build_flags}
[env:pico2w-tft]
extends = mcu_pico2w
build_flags = ${mcu_pico2w.build_flags} ${disp_tft.build_flags}

; Аппаратный тест: сканер I2C для проверки OLED (только hwtest/i2c_scan.cpp)
[env:esp32s3-i2cscan]
extends = mcu_esp32s3
build_src_filter = -<*> +<../hwtest/i2c_scan.cpp>
lib_deps =

; Waveshare RP2350-LCD-0.96: встроенный ST7735S 160x80 на SPI1
[env:pico2-lcd096]
extends = mcu_pico2
build_flags = ${mcu_pico2.build_flags} ${disp_tft096.build_flags}
    -DBOARD_PINS_FILE='"boards/board_rp2350_lcd096.h"'
    -DTFT_SPI=SPI1

; Аппаратный тест дисплея RP2350-LCD-0.96 (только hwtest/lcd096_test.cpp)
[env:pico2-lcd096-test]
extends = mcu_pico2
build_src_filter = -<*> +<../hwtest/lcd096_test.cpp>
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit BusIO@^1.17.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0

; ------------------------------------------------------------ тесты на ПК
[env:native]
platform = platformio/native @ 1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall

; SH1106 I2C + EC11 + CON/BACK. Остальные пины берутся из файла платы.
[env:esp32s3-sh1106-ec11]
extends = mcu_esp32s3
build_flags = ${mcu_esp32s3.build_flags} ${disp_sh1106.build_flags}
    -DPIN_BTN_OK=17 -DPIN_BTN_BACK=18

[env:pico2-sh1106-ec11]
extends = mcu_pico2
build_flags = ${mcu_pico2.build_flags} ${disp_sh1106.build_flags}
    -DPIN_BTN_OK=10 -DPIN_BTN_BACK=11

[env:pico2w-sh1106-ec11]
extends = mcu_pico2w
build_flags = ${mcu_pico2w.build_flags} ${disp_sh1106.build_flags}
    -DPIN_BTN_OK=10 -DPIN_BTN_BACK=11
